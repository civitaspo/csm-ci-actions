name: csm-ci server

# Called from the server repository on `label: created` with `secrets: inherit`.
# Each job checks out csm-ci-actions at job.workflow_sha so it runs the actions of the same commit.
on:
  workflow_call:
    inputs:
      config-path:
        description: Path of csm-ci.yaml in the server repository.
        type: string
        default: csm-ci.yaml

permissions: {}

jobs:
  intake:
    if: >-
      github.event_name == 'label' && github.event.action == 'created' &&
      startsWith(github.event.label.name, 'csm-ci-') && github.event.sender.type == 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      kind: ${{ steps.intake.outputs.kind }}
      owner: ${{ steps.intake.outputs.owner }}
      name: ${{ steps.intake.outputs.name }}
      args: ${{ steps.intake.outputs.args }}
      concurrency-key: ${{ steps.intake.outputs.concurrency-key }}
      release: ${{ steps.intake.outputs.release }}
      server-bot-id: ${{ steps.intake.outputs.server-bot-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .csm-ci-actions
          persist-credentials: false
      - id: intake
        uses: ./.csm-ci-actions/actions/intake
        with:
          config-path: ${{ inputs.config-path }}

  op:
    needs: [intake]
    if: needs.intake.outputs.kind != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment: csm-ci
    # Keyed on the normalized repository and number from intake, so spelling variants share a group.
    concurrency:
      group: csm-ci-${{ needs.intake.outputs.concurrency-key }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .csm-ci-actions
          persist-credentials: false
      - id: server-token
        if: contains(fromJSON('["approve", "policy-check"]'), needs.intake.outputs.kind)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.intake.outputs.owner }}
          repositories: ${{ needs.intake.outputs.name }}
          permission-contents: read
          permission-pull-requests: ${{ needs.intake.outputs.kind == 'approve' && 'write' || 'read' }}
          permission-checks: write
      - id: securefix-read-token
        if: needs.intake.outputs.kind == 'securefix'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.intake.outputs.owner }}
          repositories: ${{ needs.intake.outputs.name }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      # The approver App needs contents:write for its approval to count, but GitHub checks the
      # App's permissions, so this token stays at pull_requests:write.
      - id: approver-token
        if: needs.intake.outputs.kind == 'approve'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_APPROVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_APPROVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.intake.outputs.owner }}
          repositories: ${{ needs.intake.outputs.name }}
          permission-pull-requests: write
      - if: needs.intake.outputs.kind == 'approve'
        uses: ./.csm-ci-actions/actions/approve
        with:
          config-path: ${{ inputs.config-path }}
          server-token: ${{ steps.server-token.outputs.token }}
          approver-token: ${{ steps.approver-token.outputs.token }}
          repository: ${{ needs.intake.outputs.owner }}/${{ needs.intake.outputs.name }}
          args: ${{ needs.intake.outputs.args }}
      - id: securefix-locate
        if: needs.intake.outputs.kind == 'securefix'
        uses: ./.csm-ci-actions/actions/server/securefix
        with:
          mode: locate
          config-path: ${{ inputs.config-path }}
          server-token: ${{ steps.securefix-read-token.outputs.token }}
          repository: ${{ needs.intake.outputs.owner }}/${{ needs.intake.outputs.name }}
          run-id: ${{ fromJSON(needs.intake.outputs.args).run_id }}
      - if: needs.intake.outputs.kind == 'securefix'
        name: Bound securefix artifact extraction
        env:
          SECUREFIX_ARTIFACT_PATH: ${{ runner.temp }}/csm-ci-securefix
        run: |
          sudo mkdir -p "$SECUREFIX_ARTIFACT_PATH"
          sudo mount -t tmpfs -o size=12m,nr_inodes=1024,mode=0700,uid="$(id -u)",gid="$(id -g)" tmpfs "$SECUREFIX_ARTIFACT_PATH"
          mountpoint -q "$SECUREFIX_ARTIFACT_PATH"
      - if: needs.intake.outputs.kind == 'securefix'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        timeout-minutes: 2
        with:
          artifact-ids: ${{ steps.securefix-locate.outputs.artifact-id }}
          github-token: ${{ steps.securefix-read-token.outputs.token }}
          repository: ${{ needs.intake.outputs.owner }}/${{ needs.intake.outputs.name }}
          run-id: ${{ fromJSON(needs.intake.outputs.args).run_id }}
          path: ${{ runner.temp }}/csm-ci-securefix
          digest-mismatch: error
      - id: securefix-prepare
        if: needs.intake.outputs.kind == 'securefix'
        uses: ./.csm-ci-actions/actions/server/securefix
        with:
          mode: prepare
          config-path: ${{ inputs.config-path }}
          server-token: ${{ steps.securefix-read-token.outputs.token }}
          repository: ${{ needs.intake.outputs.owner }}/${{ needs.intake.outputs.name }}
          run-id: ${{ fromJSON(needs.intake.outputs.args).run_id }}
          artifact-path: ${{ runner.temp }}/csm-ci-securefix
      - id: securefix-write-token
        if: >-
          needs.intake.outputs.kind == 'securefix' &&
          (steps.securefix-prepare.outputs.result == 'ready' || steps.securefix-prepare.outputs.route-mode == 'true') &&
          steps.securefix-prepare.outputs.requires-workflows-write != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.intake.outputs.owner }}
          repositories: ${{ needs.intake.outputs.name }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: ${{ steps.securefix-prepare.outputs.route-mode == 'true' && 'write' || 'read' }}
      - id: securefix-workflow-token
        if: needs.intake.outputs.kind == 'securefix' && steps.securefix-prepare.outputs.requires-workflows-write == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.intake.outputs.owner }}
          repositories: ${{ needs.intake.outputs.name }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: ${{ steps.securefix-prepare.outputs.route-mode == 'true' && 'write' || 'read' }}
          permission-workflows: write
      - id: merge-read-token
        if: needs.intake.outputs.kind == 'merge'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.intake.outputs.owner }}
          repositories: ${{ needs.intake.outputs.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
          permission-issues: read
      - id: merge-notify-token
        if: needs.intake.outputs.kind == 'merge'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.intake.outputs.owner }}
          repositories: ${{ needs.intake.outputs.name }}
          permission-issues: write
          permission-pull-requests: write
      - id: merge-ready
        if: needs.intake.outputs.kind == 'merge'
        continue-on-error: true
        uses: ./.csm-ci-actions/actions/merge
        with:
          mode: wait
          config-path: ${{ inputs.config-path }}
          server-token: ${{ steps.merge-read-token.outputs.token }}
          notification-token: ${{ steps.merge-notify-token.outputs.token }}
          repository: ${{ needs.intake.outputs.owner }}/${{ needs.intake.outputs.name }}
          args: ${{ needs.intake.outputs.args }}
      - id: merge-failure-notify-token
        if: needs.intake.outputs.kind == 'merge' && steps.merge-ready.outcome == 'failure' && steps.merge-ready.outputs.accepted == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.intake.outputs.owner }}
          repositories: ${{ needs.intake.outputs.name }}
          permission-issues: write
          permission-pull-requests: write
      - if: needs.intake.outputs.kind == 'merge' && steps.merge-ready.outcome == 'failure' && steps.merge-ready.outputs.accepted == 'true'
        continue-on-error: true
        uses: ./.csm-ci-actions/actions/merge
        with:
          mode: failure-receipt
          config-path: ${{ inputs.config-path }}
          server-token: ${{ steps.merge-read-token.outputs.token }}
          notification-token: ${{ steps.merge-failure-notify-token.outputs.token }}
          repository: ${{ needs.intake.outputs.owner }}/${{ needs.intake.outputs.name }}
          args: ${{ needs.intake.outputs.args }}
          failure-message: ${{ steps.merge-ready.outputs.error }}
      - if: always() && needs.intake.outputs.kind == 'merge' && steps.merge-ready.outcome == 'failure'
        env:
          FAILURE_MESSAGE: ${{ steps.merge-ready.outputs.error }}
        run: |
          echo "$FAILURE_MESSAGE" >&2
          exit 1
      - id: merge-final-read-token
        if: needs.intake.outputs.kind == 'merge' && steps.merge-ready.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.intake.outputs.owner }}
          repositories: ${{ needs.intake.outputs.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
          permission-issues: read
      - id: merge-final-notify-token
        if: needs.intake.outputs.kind == 'merge' && steps.merge-ready.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.intake.outputs.owner }}
          repositories: ${{ needs.intake.outputs.name }}
          permission-issues: write
          permission-pull-requests: write
      - id: merge-token
        if: needs.intake.outputs.kind == 'merge' && steps.merge-ready.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.intake.outputs.owner }}
          repositories: ${{ needs.intake.outputs.name }}
          permission-contents: write
          permission-pull-requests: write
      - if: needs.intake.outputs.kind == 'merge'
        uses: ./.csm-ci-actions/actions/merge
        with:
          mode: merge
          config-path: ${{ inputs.config-path }}
          server-token: ${{ steps.merge-final-read-token.outputs.token }}
          notification-token: ${{ steps.merge-final-notify-token.outputs.token }}
          write-token: ${{ steps.merge-token.outputs.token }}
          repository: ${{ needs.intake.outputs.owner }}/${{ needs.intake.outputs.name }}
          args: ${{ needs.intake.outputs.args }}
          head: ${{ steps.merge-ready.outputs.head }}
      - if: needs.intake.outputs.kind == 'policy-check'
        uses: ./.csm-ci-actions/actions/policy-check
        with:
          config-path: ${{ inputs.config-path }}
          server-token: ${{ steps.server-token.outputs.token }}
          repository: ${{ needs.intake.outputs.owner }}/${{ needs.intake.outputs.name }}
          pull-number: ${{ fromJSON(needs.intake.outputs.args).pull_number }}
      - if: >-
          needs.intake.outputs.kind == 'securefix' &&
          (steps.securefix-prepare.outputs.result == 'ready' || steps.securefix-prepare.outputs.route-mode == 'true')
        uses: ./.csm-ci-actions/actions/server/securefix
        with:
          mode: apply
          config-path: ${{ inputs.config-path }}
          server-token: ${{ steps.securefix-read-token.outputs.token }}
          write-token: ${{ steps.securefix-workflow-token.outputs.token || steps.securefix-write-token.outputs.token }}
          repository: ${{ needs.intake.outputs.owner }}/${{ needs.intake.outputs.name }}
          run-id: ${{ fromJSON(needs.intake.outputs.args).run_id }}
          artifact-path: ${{ runner.temp }}/csm-ci-securefix
      - if: always() && needs.intake.outputs.kind == 'securefix'
        name: Release securefix artifact extraction space
        env:
          SECUREFIX_ARTIFACT_PATH: ${{ runner.temp }}/csm-ci-securefix
        run: |
          if mountpoint -q "$SECUREFIX_ARTIFACT_PATH"; then
            sudo umount "$SECUREFIX_ARTIFACT_PATH"
          fi
          sudo rm -rf "$SECUREFIX_ARTIFACT_PATH"
      - if: >-
          !contains(fromJSON('["approve", "merge", "policy-check", "securefix"]'), needs.intake.outputs.kind)
        env:
          KIND: ${{ needs.intake.outputs.kind }}
        run: echo "no $KIND handler yet"

  release-plan:
    needs: [intake]
    if: needs.intake.outputs.kind == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: csm-ci
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      matrix: ${{ steps.plan.outputs.matrix }}
      merge-sha: ${{ steps.plan.outputs.merge-sha }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      build-type: ${{ steps.plan.outputs.build-type }}
      source-date-epoch: ${{ steps.source-date.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .csm-ci-actions
          persist-credentials: false
      - id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.intake.outputs.owner }}
          repositories: ${{ needs.intake.outputs.name }}
          permission-contents: read
          permission-pull-requests: read
      - id: plan
        uses: ./.csm-ci-actions/actions/release-plan
        with:
          github-token: ${{ steps.read-token.outputs.token }}
          repository: ${{ needs.intake.outputs.owner }}/${{ needs.intake.outputs.name }}
          pull-number: ${{ fromJSON(needs.intake.outputs.args).pull_number }}
          server-bot-id: ${{ needs.intake.outputs.server-bot-id }}
          release-config: ${{ needs.intake.outputs.release }}
      - id: tag-token
        if: steps.plan.outputs.tag-exists != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.intake.outputs.owner }}
          repositories: ${{ needs.intake.outputs.name }}
          permission-contents: write
      - uses: ./.csm-ci-actions/actions/release-tag
        if: steps.plan.outputs.tag-exists != 'true'
        with:
          github-token: ${{ steps.tag-token.outputs.token }}
          plan: ${{ steps.plan.outputs.plan }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.intake.outputs.owner }}/${{ needs.intake.outputs.name }}
          ref: ${{ steps.plan.outputs.merge-sha }}
          token: ${{ steps.read-token.outputs.token }}
          path: client
          persist-credentials: false
      - id: source-date
        name: Record the merge commit timestamp
        env:
          MERGE_SHA: ${{ steps.plan.outputs.merge-sha }}
        run: echo "epoch=$(git -C client show -s --format=%ct "$MERGE_SHA")" >> "$GITHUB_OUTPUT"
      - name: Archive the tracked merge source
        env:
          MERGE_SHA: ${{ steps.plan.outputs.merge-sha }}
        run: git -C client archive --format=tar --output="$RUNNER_TEMP/release-source.tar" "$MERGE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source.tar
          if-no-files-found: error
          retention-days: 1

  release-build:
    needs: [intake, release-plan]
    if: needs.intake.outputs.kind == 'release'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .csm-ci-actions
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-source
          path: client
      - name: Prepare the isolated source snapshot
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
          SOURCE_DATE_EPOCH: ${{ needs.release-plan.outputs.source-date-epoch }}
          SOURCE_REPOSITORY: ${{ needs.intake.outputs.owner }}/${{ needs.intake.outputs.name }}
        run: |
          if ! [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]]; then
            echo "Invalid source commit timestamp" >&2
            exit 1
          fi
          tar -xf client/release-source.tar -C client
          rm client/release-source.tar
          git -C client init --quiet
          git -C client remote add origin "$GITHUB_SERVER_URL/$SOURCE_REPOSITORY.git"
          git -C client config user.name "csm-ci release build"
          git -C client config user.email "csm-ci-release-build@users.noreply.github.com"
          git -C client add -f -A
          GIT_AUTHOR_DATE="@$SOURCE_DATE_EPOCH +0000" \
            GIT_COMMITTER_DATE="@$SOURCE_DATE_EPOCH +0000" \
            git -C client -c commit.gpgsign=false commit --quiet -m "release source"
          git -C client tag "$RELEASE_TAG"
          mkdir -p assets
      - if: needs.release-plan.outputs.build-type == 'none'
        uses: ./.csm-ci-actions/actions/release-build/none
      - if: needs.release-plan.outputs.build-type == 'js-action'
        uses: ./.csm-ci-actions/actions/release-build/js-action
        with:
          client-path: client
      - if: needs.release-plan.outputs.build-type == 'goreleaser'
        uses: ./.csm-ci-actions/actions/release-build/goreleaser
        with:
          client-path: client
      - if: needs.release-plan.outputs.build-type == 'cargo'
        uses: ./.csm-ci-actions/actions/release-build/cargo
        with:
          client-path: client
          repository: ${{ needs.intake.outputs.owner }}/${{ needs.intake.outputs.name }}
          version: ${{ needs.release-plan.outputs.version }}
          target: ${{ matrix.target }}
      - if: hashFiles('assets/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ matrix.target || 'default' }}
          path: assets/
          if-no-files-found: error
          retention-days: 1

  release-publish:
    needs: [intake, release-plan, release-build]
    if: needs.intake.outputs.kind == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: csm-ci
    permissions:
      contents: read
      id-token: write
      attestations: write
    concurrency:
      group: csm-ci-release-${{ needs.intake.outputs.owner }}-${{ needs.intake.outputs.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .csm-ci-actions
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: contains(fromJSON('["cargo", "goreleaser"]'), needs.release-plan.outputs.build-type)
        with:
          pattern: release-assets-*
          path: assets
          merge-multiple: true
      - id: assets
        uses: ./.csm-ci-actions/actions/release-assets
        with:
          directory: assets
      - id: predicate
        env:
          CLIENT_REPOSITORY: ${{ needs.intake.outputs.owner }}/${{ needs.intake.outputs.name }}
          MERGE_SHA: ${{ needs.release-plan.outputs.merge-sha }}
          TAG: ${{ needs.release-plan.outputs.tag }}
        run: jq -cn --arg repository "$CLIENT_REPOSITORY" --arg sha "$MERGE_SHA" --arg tag "$TAG" '{client_repository:$repository,merge_sha:$sha,tag:$tag}' > "$RUNNER_TEMP/release-predicate.json"
      - uses: actions/attest@f057fd524d485ac48d9b534c235aad15b5bb303f # v3.0.0
        with:
          subject-path: ${{ steps.assets.outputs.subject-path }}
          predicate-type: https://github.com/civitaspo/csm-ci-actions/attestation/release/v1
          predicate-path: ${{ runner.temp }}/release-predicate.json
      - id: server-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.intake.outputs.owner }}
          repositories: ${{ needs.intake.outputs.name }}
          permission-contents: write
      - uses: ./.csm-ci-actions/actions/release-publish
        with:
          github-token: ${{ steps.server-token.outputs.token }}
          plan: ${{ needs.release-plan.outputs.plan }}
          assets: ${{ steps.assets.outputs.assets }}
          directory: assets

  cleanup:
    needs: [intake, op, release-plan, release-build, release-publish]
    if: >-
      always() && github.event_name == 'label' && github.event.action == 'created' &&
      startsWith(github.event.label.name, 'csm-ci-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Delete the request label
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ github.event.label.name }}
          REPOSITORY: ${{ github.repository }}
        run: gh label delete "$LABEL" --repo "$REPOSITORY" --yes

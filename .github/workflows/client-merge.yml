name: csm-ci client merge

# Called from a client repository on issue_comment with a named secret mapping.
on:
  workflow_call:
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  request:
    if: >-
      github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.pull_request &&
      (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) ||
      (github.event.comment.user.type == 'Bot' && github.event.comment.user.id == github.event.issue.user.id)) &&
      github.event.comment.body == '/merge'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: $/actions/client/merge
        with:
          client-id: ${{ vars.CSM_CI_CLIENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
          server-repository: ${{ vars.CSM_CI_SERVER_REPOSITORY }}

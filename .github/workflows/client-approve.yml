name: csm-ci client approve

# Called from a client repository on pull_request_target and issue_comment with a named secret mapping.
# It never checks out the pull request. It only asks the server to look at it.
on:
  workflow_call:
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  request:
    if: >-
      (github.event_name == 'pull_request_target' &&
       contains(fromJSON('["opened", "synchronize", "reopened", "ready_for_review"]'), github.event.action)) ||
      (github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.pull_request &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       (github.event.comment.body == '/recheck' || github.event.comment.body == '/approve'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: $/actions/client/approve
        with:
          client-id: ${{ vars.CSM_CI_CLIENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
          server-repository: ${{ vars.CSM_CI_SERVER_REPOSITORY }}

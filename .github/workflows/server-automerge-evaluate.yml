name: csm-ci automerge evaluation

on:
  workflow_call:
    secrets:
      CSM_CI_SERVER_APP_PRIVATE_KEY:
        required: true
    inputs:
      repository:
        description: owner/repo of the client repository.
        type: string
        required: true
      repository-owner:
        description: Owner of the client repository.
        type: string
        required: true
      repository-name:
        description: Name of the client repository.
        type: string
        required: true
      pull-number:
        description: Pull request number to evaluate.
        type: number
        required: true
      deployment-id:
        description: Deployment ID for a scheduled reservation, if known.
        type: string
        required: false
      concurrency-key:
        description: Shared normalized key for event and sweep evaluation of this pull request.
        type: string
        required: true
      config-path:
        description: Path of csm-ci.yaml in the server repository.
        type: string
        default: csm-ci.yaml

permissions: {}

jobs:
  evaluate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: csm-ci
    concurrency:
      group: csm-ci-${{ inputs.concurrency-key }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .csm-ci-actions
          persist-credentials: false
      - id: deployments-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-deployments: write
      - id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ inputs.repository-owner }}
          repositories: ${{ inputs.repository-name }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
          permission-issues: read
      - id: notification-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ inputs.repository-owner }}
          repositories: ${{ inputs.repository-name }}
          permission-issues: write
          permission-pull-requests: write
      - id: readiness
        uses: ./.csm-ci-actions/actions/server/automerge
        with:
          mode: evaluate
          config-path: ${{ inputs.config-path }}
          deployments-token: ${{ steps.deployments-token.outputs.token }}
          server-token: ${{ steps.read-token.outputs.token }}
          notification-token: ${{ steps.notification-token.outputs.token }}
          repository: ${{ inputs.repository }}
          pull-number: ${{ inputs.pull-number }}
          deployment-id: ${{ inputs.deployment-id }}
      - id: write-token
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ inputs.repository-owner }}
          repositories: ${{ inputs.repository-name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - id: merge
        if: steps.readiness.outputs.ready == 'true'
        uses: ./.csm-ci-actions/actions/server/automerge
        with:
          mode: merge
          config-path: ${{ inputs.config-path }}
          deployments-token: ${{ steps.deployments-token.outputs.token }}
          server-token: ${{ steps.read-token.outputs.token }}
          notification-token: ${{ steps.notification-token.outputs.token }}
          write-token: ${{ steps.write-token.outputs.token }}
          repository: ${{ inputs.repository }}
          pull-number: ${{ inputs.pull-number }}
          deployment-id: ${{ steps.readiness.outputs.deployment-id || inputs.deployment-id }}
          head: ${{ steps.readiness.outputs.head }}
      - if: failure()
        continue-on-error: true
        uses: ./.csm-ci-actions/actions/server/automerge
        with:
          mode: error-status
          config-path: ${{ inputs.config-path }}
          server-token: ${{ steps.read-token.outputs.token }}
          deployments-token: ${{ steps.deployments-token.outputs.token }}
          deployment-id: ${{ steps.readiness.outputs.deployment-id || inputs.deployment-id }}
          repository: ${{ inputs.repository }}
          pull-number: ${{ inputs.pull-number }}

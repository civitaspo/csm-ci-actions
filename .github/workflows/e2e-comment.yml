name: e2e-comment

# `/e2e --feature <features>` runs live e2e; `/e2e --cancel [<run-id>]` requests a safe stop. issue_comment workflows
# run from the default branch, so the privileged e2e job, its harness and its environment come from
# main. The authorize job runs command logic from main; the e2e job may check out the pull request's
# harness after authorization. Candidate action code reaches the testing repositories via the e2e branch.
# Commands must not cancel each other, and e2e.yml serializes the runs.
# jactionlint ignore=concurrency-limits
on:
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    # Prefilter only. The step below validates the command and the commenter.
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/e2e') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      deployments: write
      actions: read
      issues: write
      pull-requests: write
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      deployment-id: ${{ steps.check.outputs.deployment-id }}
      ref: ${{ steps.check.outputs.ref }}
      feature: ${{ steps.check.outputs.feature }}
      scenario: ${{ steps.check.outputs.scenario }}
      harness-ref: ${{ steps.check.outputs.harness-ref }}
      harness: ${{ steps.check.outputs.harness }}
      cancel: ${{ steps.check.outputs.cancel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENTER_ID: ${{ github.event.comment.user.id }}
          BODY: ${{ github.event.comment.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: bun e2e/e2e-comment.ts authorize
      - name: Link to the pull request
        if: ${{ steps.check.outputs.ok == 'true' && steps.check.outputs.cancel != 'true' }}
        env:
          PR: ${{ github.event.issue.number }}
          PR_TITLE: ${{ github.event.issue.title }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          pr_url="$SERVER_URL/$REPO/pull/$PR"
          title="${PR_TITLE:-Pull request}"
          title="${title//\\/\\\\}"
          title="${title//\[/\\[}"
          title="${title//\]/\\]}"
          {
            printf 'Triggered by the pull request:\n\n'
            printf -- '- Title: [%s #%s](%s)\n' "$title" "$PR" "$pr_url"
            printf -- '- Pull request URL: %s\n' "$pr_url"
            printf -- '- Comment URL: %s\n' "$COMMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # A reusable workflow cannot read the csm-ci-e2e environment's secrets, so this job mirrors e2e.yml.
  # It checks out the PR head only when authorize chose the PR's harness.
  e2e:
    needs: authorize
    if: ${{ needs.authorize.outputs.ok == 'true' && needs.authorize.outputs.cancel != 'true' }}
    outputs:
      cancelled: ${{ steps.scenarios.outputs.cancelled }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment:
      name: csm-ci-e2e
      deployment: false
    concurrency:
      group: e2e
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.harness-ref }}
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: untrusted-committer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_UNTRUSTED_COMMITTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_UNTRUSTED_COMMITTER_APP_PRIVATE_KEY }}
          # The token must cover every installed repository so the next step can compare the set.
          # jactionlint ignore=github-app
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
      - name: Untrusted committer app is installed only on the testing client
        env:
          GH_TOKEN: ${{ steps.untrusted-committer.outputs.token }}
        run: test "$(gh api /installation/repositories --jq '[.repositories[].name] | sort | join(",")')" = "testing-csm-ci-client"
      - id: scenarios
        name: Run scenarios
        env:
          GH_TOKEN: ${{ secrets.CSM_CI_OWNER_TOKEN }}
          CSM_CI_ACTIONS_TOKEN: ${{ github.token }}
          CSM_CI_UNTRUSTED_COMMITTER_TOKEN: ${{ steps.untrusted-committer.outputs.token }}
          REF: ${{ needs.authorize.outputs.ref }}
          FEATURE: ${{ needs.authorize.outputs.feature }}
          SCENARIO: ${{ needs.authorize.outputs.scenario }}
          E2E_PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          args=(--ref "$REF" --feature "$FEATURE")
          if [ -n "$SCENARIO" ]; then args+=(--scenario "$SCENARIO"); fi
          bun e2e/run.ts "${args[@]}"

  report:
    needs: [authorize, e2e]
    if: ${{ always() && needs.authorize.outputs.ok == 'true' && needs.authorize.outputs.cancel != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      deployments: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RESULT: ${{ needs.e2e.outputs.cancelled == 'true' && 'cancelled' || needs.e2e.result }}
          DEPLOYMENT_ID: ${{ needs.authorize.outputs.deployment-id }}
          REF: ${{ needs.authorize.outputs.ref }}
          FEATURE: ${{ needs.authorize.outputs.feature }}
          SCENARIO: ${{ needs.authorize.outputs.scenario }}
          HARNESS: ${{ needs.authorize.outputs.harness }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun e2e/e2e-comment.ts report

name: e2e-comment

# `/e2e <features>` on a pull request runs the live e2e of its head commit. issue_comment workflows
# run from the default branch, so the privileged e2e job, its harness and its environment come from
# main. The pull request's code is never checked out here; it only reaches the testing repositories
# through the harness's e2e branch.
# Commands must not cancel each other, and e2e.yml serializes the runs.
# jactionlint ignore=concurrency-limits
on:
  # jactionlint ignore=dangerous-triggers
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    # Prefilter only. The step below validates the command and the commenter.
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/e2e') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      ref: ${{ steps.check.outputs.ref }}
      feature: ${{ steps.check.outputs.feature }}
      scenario: ${{ steps.check.outputs.scenario }}
      harness-ref: ${{ steps.check.outputs.harness-ref }}
      harness: ${{ steps.check.outputs.harness }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          BODY: ${{ github.event.comment.body }}
          OWNER_ID: "4525500"
          COMMENTER_ID: ${{ github.event.comment.user.id }}
          # Immutable IDs allowed to run live e2e: the repository owner civitaspo.
          ALLOWED_IDS: "4525500"
          # Keep in sync with FEATURES in e2e/pr-metadata.ts; e2e/e2e-comment.test.ts checks it.
          KNOWN_FEATURES: "smoke approve merge policy-check securefix release release-pr repo-settings"
        run: |
          set -euo pipefail
          reply() { gh api "/repos/$REPO/issues/$PR/comments" -f body="$1" > /dev/null; }
          case " $ALLOWED_IDS " in
            *" $COMMENTER_ID "*) ;;
            *) echo "commenter $COMMENTER_ID is not allowed to run e2e"; echo ok=false >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          re='^/e2e ([a-z-]+(,[a-z-]+)*)( --scenario ([^[:cntrl:]]{1,200}))?[[:space:]]*$'
          if [[ ! "$BODY" =~ $re ]]; then
            reply "e2e rejected: the comment must be exactly \`/e2e <feature>[,<feature>...] [--scenario <name substring>]\`."
            echo ok=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          feature="${BASH_REMATCH[1]}"
          scenario="${BASH_REMATCH[4]-}"
          scenario="${scenario%"${scenario##*[![:space:]]}"}"
          IFS=, read -ra names <<< "$feature"
          for name in "${names[@]}"; do
            case " $KNOWN_FEATURES " in
              *" $name "*) ;;
              *) reply "e2e rejected: unknown feature \`$name\`. Known: $KNOWN_FEATURES."; echo ok=false >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done
          read -r state sha head_repo < <(gh api "/repos/$REPO/pulls/$PR" --jq '[.state, .head.sha, .head.repo.full_name] | @tsv')
          if [ "$state" != open ]; then
            reply "e2e rejected: the pull request is not open."
            echo ok=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The PR's harness gets the e2e credentials only for the owner's own verified commits.
          harness_ref=""; harness="main"
          if [ "$head_repo" = "$REPO" ]; then
            bad=$(gh api --paginate "/repos/$REPO/pulls/$PR/commits" --jq ".[] | select(.commit.verification.verified != true or .author.id != $OWNER_ID) | .sha" | wc -l)
            if [ "$bad" -eq 0 ]; then harness_ref=$sha; harness="pr"; fi
          fi
          gh api "/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null
          {
            echo ok=true
            echo "ref=$sha"
            echo "feature=$feature"
            echo "scenario=$scenario"
            echo "harness-ref=$harness_ref"
            echo "harness=$harness"
          } >> "$GITHUB_OUTPUT"

  run:
    needs: authorize
    if: ${{ needs.authorize.outputs.ok == 'true' }}
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ needs.authorize.outputs.ref }}
      feature: ${{ needs.authorize.outputs.feature }}
      scenario: ${{ needs.authorize.outputs.scenario }}
      harness-ref: ${{ needs.authorize.outputs.harness-ref }}
    permissions:
      contents: write
      issues: write

  report:
    needs: [authorize, run]
    if: ${{ always() && needs.authorize.outputs.ok == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RESULT: ${{ needs.run.result }}
          REF: ${{ needs.authorize.outputs.ref }}
          FEATURE: ${{ needs.authorize.outputs.feature }}
          SCENARIO: ${{ needs.authorize.outputs.scenario }}
          HARNESS: ${{ needs.authorize.outputs.harness }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = success ]; then mark=pass; reaction=rocket; else mark="fail ($RESULT)"; reaction=-1; fi
          gh api "/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content="$reaction" > /dev/null
          scope="\`$FEATURE\`"
          if [ -n "$SCENARIO" ]; then scope="$scope, scenarios containing \`$SCENARIO\`"; fi
          gh api "/repos/$REPO/issues/$PR/comments" -f body="e2e $scope at \`$REF\` (harness: $HARNESS): **$mark**. Run: $RUN_URL" > /dev/null

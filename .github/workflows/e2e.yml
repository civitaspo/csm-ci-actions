name: e2e

on:
  # Called by e2e-comment.yml for the /e2e command; dispatch is the manual path.
  workflow_call:
    inputs:
      ref:
        description: Full commit sha of csm-ci-actions to test.
        required: true
        type: string
      feature:
        description: Comma-separated features whose scenarios run together.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit sha of csm-ci-actions to test.
        required: true
        type: string
      feature:
        description: Comma-separated features whose scenarios run together, for example approve,merge,policy-check,smoke.
        default: smoke
        type: string

permissions: {}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    # Several features can run in one invocation.
    timeout-minutes: 120
    environment: csm-ci-e2e
    # The scenarios share the testing repositories and the e2e branch.
    concurrency:
      group: e2e
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: untrusted-committer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_UNTRUSTED_COMMITTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_UNTRUSTED_COMMITTER_APP_PRIVATE_KEY }}
          # The token must cover every installed repository so the next step can compare the set.
          # jactionlint ignore=github-app
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
      - name: Untrusted committer app is installed only on the testing client
        env:
          GH_TOKEN: ${{ steps.untrusted-committer.outputs.token }}
        run: test "$(gh api /installation/repositories --jq '[.repositories[].name] | sort | join(",")')" = "testing-csm-ci-client"
      - name: Run scenarios
        env:
          GH_TOKEN: ${{ secrets.CSM_CI_OWNER_TOKEN }}
          CSM_CI_ACTIONS_TOKEN: ${{ github.token }}
          CSM_CI_UNTRUSTED_COMMITTER_TOKEN: ${{ steps.untrusted-committer.outputs.token }}
          REF: ${{ inputs.ref }}
          FEATURE: ${{ inputs.feature }}
        run: bun e2e/run.ts --ref "$REF" --feature "$FEATURE"

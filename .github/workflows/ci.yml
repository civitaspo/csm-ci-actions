name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  status-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
      - name: English only
        run: |
          # The repository is public, so every tracked file is English (see AGENTS.md).
          if git ls-files -z | xargs -0 grep -nP '[\x{3040}-\x{30ff}\x{3400}-\x{4dbf}\x{4e00}-\x{9fff}\x{ff00}-\x{ffef}]'; then
            echo "Tracked files must be English. Translate the lines above." >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun test
      - name: check-dist
        run: |
          bun run build
          if [ -n "$(git status --porcelain dist/)" ]; then
            git status --porcelain dist/
            echo "dist/ is not the build output of this commit. Run bun run build and commit dist/." >&2
            exit 1
          fi
      - name: jactionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: jactionlint --online
      - name: Verify shared client action lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run actions-lock-verify

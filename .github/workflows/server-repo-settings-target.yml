name: csm-ci repository settings target

on:
  workflow_call:
    secrets:
      CSM_CI_SERVER_APP_PRIVATE_KEY:
        required: true
      CSM_CI_APPROVER_APP_PRIVATE_KEY:
        required: false
    inputs:
      workflow-release:
        description: Stable version and full SHA validated by trusted discovery.
        type: string
        required: true
      repository:
        description: Validated owner/repo target selected by the server workflow.
        type: string
        required: true
      event-mode:
        description: schedule or dispatch, derived by the trusted server workflow.
        type: string
        required: true
      targets:
        description: Comma-separated settings, rulesets, releases, managed-files, or all, validated by the server workflow.
        type: string
        default: all
      config-path:
        description: Path of csm-ci.yaml in the server repository.
        type: string
        default: csm-ci.yaml

permissions: {}

concurrency:
  group: csm-ci-repo-settings-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    outputs:
      target-owner: ${{ steps.target.outputs.target-owner }}
      target-name: ${{ steps.target.outputs.target-name }}
      managed-pull-number: ${{ steps.managed-apply.outcome == 'success' && steps.managed-apply.outputs.pull-request || steps.managed-inspect.outputs.pull-request || '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: csm-ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .csm-ci-actions
          persist-credentials: false
      - id: target
        uses: ./.csm-ci-actions/actions/server/repo-settings
        with:
          mode: validate-target
          targets: ${{ inputs.targets }}
          event-mode: ${{ inputs.event-mode }}
          github-token: ${{ github.token }}
          config-path: ${{ inputs.config-path }}
          repository: ${{ inputs.repository }}
          actions-repository: ${{ job.workflow_repository }}
      - id: read-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.target-owner }}
          repositories: ${{ steps.target.outputs.target-name }}
          permission-contents: read
          permission-pull-requests: read
      # GitHub returns ruleset bypass actors only to callers with write access
      # to the ruleset, so inspection already needs this token. Writes stay in
      # the apply stage, which reruns the activation preflight first.
      - id: admin-token
        name: Mint administration write token
        if: steps.target.outputs.selects-administration == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.target-owner }}
          repositories: ${{ steps.target.outputs.target-name }}
          permission-administration: write
      - id: inspect
        if: steps.target.outputs.selects-administration == 'true'
        uses: ./.csm-ci-actions/actions/server/repo-settings
        with:
          mode: inspect
          targets: ${{ steps.target.outputs.targets }}
          github-token: ${{ github.token }}
          config-path: ${{ inputs.config-path }}
          repository: ${{ inputs.repository }}
          event-mode: ${{ inputs.event-mode }}
          admin-token: ${{ steps.admin-token.outputs.token }}
          actions-repository: ${{ job.workflow_repository }}
      - id: preflight
        if: steps.target.outputs.selects-rulesets == 'true' && inputs.event-mode == 'dispatch' && steps.inspect.outputs.activation-required == 'true'
        uses: ./.csm-ci-actions/actions/server/repo-settings
        with:
          mode: preflight
          targets: ${{ steps.target.outputs.targets }}
          github-token: ${{ github.token }}
          config-path: ${{ inputs.config-path }}
          repository: ${{ inputs.repository }}
          actions-repository: ${{ job.workflow_repository }}
          read-token: ${{ steps.read-token.outputs.token }}
      # Successful token issuance proves contents:write capability. This is
      # delayed until the caller and auto-merge queue checks passed.
      - id: approver-token
        name: Mint approver contents token
        if: >-
          steps.target.outputs.selects-rulesets == 'true' &&
          inputs.event-mode == 'dispatch' &&
          steps.inspect.outputs.activation-required == 'true' &&
          steps.preflight.outputs.caller-distributed == 'true' &&
          steps.preflight.outputs.auto-merge-queue-count == '0'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CSM_CI_APPROVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_APPROVER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.target-owner }}
          repositories: ${{ steps.target.outputs.target-name }}
          permission-contents: write
      - name: Apply repository settings
        if: steps.target.outputs.selects-administration == 'true' && steps.inspect.outputs.has-changes == 'true'
        uses: ./.csm-ci-actions/actions/server/repo-settings
        with:
          mode: apply
          targets: ${{ steps.target.outputs.targets }}
          github-token: ${{ github.token }}
          config-path: ${{ inputs.config-path }}
          repository: ${{ inputs.repository }}
          event-mode: ${{ inputs.event-mode }}
          read-token: ${{ steps.read-token.outputs.token }}
          admin-token: ${{ steps.admin-token.outputs.token }}
          actions-repository: ${{ job.workflow_repository }}
          approver-app-slug: ${{ steps.approver-token.outputs.app-slug }}
      - id: managed-inspect
        if: steps.target.outputs.selects-managed-files == 'true'
        uses: ./.csm-ci-actions/actions/server/repo-settings
        with:
          mode: managed-inspect
          workflow-release: ${{ inputs.workflow-release }}
          targets: ${{ steps.target.outputs.targets }}
          github-token: ${{ github.token }}
          config-path: ${{ inputs.config-path }}
          repository: ${{ inputs.repository }}
          actions-repository: ${{ job.workflow_repository }}
          read-token: ${{ steps.read-token.outputs.token }}
      - id: contents-token
        name: Mint managed contents token
        if: steps.managed-inspect.outputs.has-changes == 'true' && steps.managed-inspect.outputs.requires-workflows-write != 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.target-owner }}
          repositories: ${{ steps.target.outputs.target-name }}
          permission-contents: write
          permission-pull-requests: write
      - id: workflow-token
        name: Mint managed workflows token
        if: steps.managed-inspect.outputs.has-changes == 'true' && steps.managed-inspect.outputs.requires-workflows-write == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.target-owner }}
          repositories: ${{ steps.target.outputs.target-name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - id: managed-apply
        name: Apply managed files
        if: steps.managed-inspect.outputs.has-changes == 'true'
        uses: ./.csm-ci-actions/actions/server/repo-settings
        with:
          mode: managed-apply
          workflow-release: ${{ inputs.workflow-release }}
          targets: ${{ steps.target.outputs.targets }}
          github-token: ${{ github.token }}
          config-path: ${{ inputs.config-path }}
          repository: ${{ inputs.repository }}
          actions-repository: ${{ job.workflow_repository }}
          read-token: ${{ steps.read-token.outputs.token }}
          contents-token: ${{ steps.workflow-token.outputs.token || steps.contents-token.outputs.token }}

  managed-preflight:
    needs: [reconcile]
    if: needs.reconcile.outputs.managed-pull-number != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: csm-ci
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.preflight.outputs.authorized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .csm-ci-actions
          persist-credentials: false
      - id: target
        uses: ./.csm-ci-actions/actions/server/repo-settings
        with:
          mode: validate-target
          targets: ${{ inputs.targets }}
          event-mode: ${{ inputs.event-mode }}
          github-token: ${{ github.token }}
          config-path: ${{ inputs.config-path }}
          repository: ${{ inputs.repository }}
          actions-repository: ${{ job.workflow_repository }}
      - id: read-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.target-owner }}
          repositories: ${{ steps.target.outputs.target-name }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
      - id: preflight
        uses: ./.csm-ci-actions/actions/server/repo-settings
        with:
          mode: managed-preflight
          workflow-release: ${{ inputs.workflow-release }}
          targets: ${{ inputs.targets }}
          github-token: ${{ github.token }}
          config-path: ${{ inputs.config-path }}
          repository: ${{ inputs.repository }}
          pull-number: ${{ needs.reconcile.outputs.managed-pull-number }}
          actions-repository: ${{ job.workflow_repository }}
          read-token: ${{ steps.read-token.outputs.token }}

  managed-approve:
    needs: [reconcile, managed-preflight]
    if: needs.reconcile.outputs.managed-pull-number != '' && needs.managed-preflight.outputs.authorized == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: csm-ci
    # This is the same lane as /approve and policy-check. Release it before managed-accept
    # takes the merge lane, then revalidate the complete managed PR at each boundary.
    concurrency:
      group: csm-ci-pull-request-${{ needs.reconcile.outputs.target-owner }}/${{ needs.reconcile.outputs.target-name }}#${{ needs.reconcile.outputs.managed-pull-number }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      approval-result: ${{ steps.approve.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .csm-ci-actions
          persist-credentials: false
      - id: target
        uses: ./.csm-ci-actions/actions/server/repo-settings
        with:
          mode: validate-target
          targets: ${{ inputs.targets }}
          event-mode: ${{ inputs.event-mode }}
          github-token: ${{ github.token }}
          config-path: ${{ inputs.config-path }}
          repository: ${{ inputs.repository }}
          actions-repository: ${{ job.workflow_repository }}
      - id: read-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ needs.reconcile.outputs.target-owner }}
          repositories: ${{ needs.reconcile.outputs.target-name }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
      # Re-run preflight only after this job owns the /approve + policy lane.
      # The earlier preflight is a queue gate; it never authorizes token minting.
      - id: preflight
        uses: ./.csm-ci-actions/actions/server/repo-settings
        with:
          mode: managed-preflight
          workflow-release: ${{ inputs.workflow-release }}
          targets: ${{ inputs.targets }}
          github-token: ${{ github.token }}
          config-path: ${{ inputs.config-path }}
          repository: ${{ inputs.repository }}
          pull-number: ${{ needs.reconcile.outputs.managed-pull-number }}
          actions-repository: ${{ job.workflow_repository }}
          read-token: ${{ steps.read-token.outputs.token }}
      - id: policy-token
        if: steps.preflight.outputs.authorized == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.target-owner }}
          repositories: ${{ steps.target.outputs.target-name }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - id: approver-token
        if: steps.preflight.outputs.authorized == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CSM_CI_APPROVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_APPROVER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.target-owner }}
          repositories: ${{ steps.target.outputs.target-name }}
          permission-pull-requests: write
      - id: approve
        if: steps.preflight.outputs.authorized == 'true'
        uses: ./.csm-ci-actions/actions/server/repo-settings
        with:
          mode: managed-approve
          workflow-release: ${{ inputs.workflow-release }}
          targets: ${{ inputs.targets }}
          github-token: ${{ github.token }}
          config-path: ${{ inputs.config-path }}
          repository: ${{ inputs.repository }}
          pull-number: ${{ needs.reconcile.outputs.managed-pull-number }}
          actions-repository: ${{ job.workflow_repository }}
          read-token: ${{ steps.policy-token.outputs.token }}
          approver-token: ${{ steps.approver-token.outputs.token }}

  managed-accept:
    needs: [reconcile, managed-approve]
    if: >-
      needs.reconcile.outputs.managed-pull-number != '' &&
      contains(fromJSON('["approved", "already-approved"]'), needs.managed-approve.outputs.approval-result)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: csm-ci
    concurrency:
      group: csm-ci-merge-${{ needs.reconcile.outputs.target-owner }}/${{ needs.reconcile.outputs.target-name }}#${{ needs.reconcile.outputs.managed-pull-number }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      deployment-id: ${{ steps.accept.outputs.deployment-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .csm-ci-actions
          persist-credentials: false
      - id: target
        uses: ./.csm-ci-actions/actions/server/repo-settings
        with:
          mode: validate-target
          targets: ${{ inputs.targets }}
          event-mode: ${{ inputs.event-mode }}
          github-token: ${{ github.token }}
          config-path: ${{ inputs.config-path }}
          repository: ${{ inputs.repository }}
          actions-repository: ${{ job.workflow_repository }}
      - id: read-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.target-owner }}
          repositories: ${{ steps.target.outputs.target-name }}
          permission-contents: read
          permission-pull-requests: read
      - id: deployments-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-deployments: write
      - id: accept
        uses: ./.csm-ci-actions/actions/server/repo-settings
        with:
          mode: managed-accept
          workflow-release: ${{ inputs.workflow-release }}
          targets: ${{ inputs.targets }}
          github-token: ${{ github.token }}
          config-path: ${{ inputs.config-path }}
          repository: ${{ inputs.repository }}
          pull-number: ${{ needs.reconcile.outputs.managed-pull-number }}
          actions-repository: ${{ job.workflow_repository }}
          read-token: ${{ steps.read-token.outputs.token }}
          deployments-token: ${{ steps.deployments-token.outputs.token }}

  managed-evaluate:
    needs: [reconcile, managed-accept]
    if: needs.reconcile.outputs.managed-pull-number != '' && needs.managed-accept.outputs.deployment-id != ''
    uses: ./.github/workflows/server-automerge-evaluate.yml
    permissions:
      actions: write
      contents: read
    with:
      repository: ${{ inputs.repository }}
      repository-owner: ${{ needs.reconcile.outputs.target-owner }}
      pull-number: ${{ fromJSON(needs.reconcile.outputs.managed-pull-number) }}
      deployment-id: ${{ needs.managed-accept.outputs.deployment-id }}
      config-path: ${{ inputs.config-path }}
    secrets:
      CSM_CI_SERVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}

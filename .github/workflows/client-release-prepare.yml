name: csm-ci client release PR

on:
  workflow_call:
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY:
        required: true
    inputs:
      version:
        description: Optional semantic version without the v prefix; git-cliff infers it when omitted.
        type: string
        required: false
        default: ""
      update-root-version:
        description: Update supported root manifest versions and the Cargo lockfile.
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  generate:
    if: >-
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: client
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .csm-ci-actions
          persist-credentials: false
      - id: prepare
        uses: ./.csm-ci-actions/actions/client/release-prepare
        with:
          workspace: ${{ github.workspace }}/client
          version: ${{ inputs.version }}
          update-root-version: ${{ inputs.update-root-version }}
          client-id: ${{ vars.CSM_CI_CLIENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
          server-repository: ${{ vars.CSM_CI_SERVER_REPOSITORY }}

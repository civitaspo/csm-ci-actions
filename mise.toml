[tools]
bun = "1.4.3"
"github:jdx/jactionlint" = "2.3.0"
"github:github/gh-actions-lock" = "0.4.0"

[tasks.actions-lock]
run = "gh-actions-lock .github/workflows/client-release-prepare.yml .github/workflows/client-release-publish.yml --no-migrate-local-actions --no-narrow --no-interactive"

[tasks.actions-lock-verify]
run = "gh-actions-lock .github/workflows/client-release-prepare.yml .github/workflows/client-release-publish.yml --verify"

name: csm-ci merge
description: Accept or cancel a pull request merge reservation.
inputs:
  mode:
    description: accept validates the command and creates or cancels its reservation.
    required: true
  github-token:
    description: Token with contents:read on the server repository to read csm-ci.yaml.
    default: ${{ github.token }}
  config-path:
    description: Path of csm-ci.yaml in the server repository.
    default: csm-ci.yaml
  server-token:
    description: Server App token for the client repository.
    required: true
  notification-token:
    description: Server App token with issues:write for reactions and command receipts.
    required: true
  deployments-token:
    description: Server App token with deployments:write on the server repository.
    required: true
  repository:
    description: owner/repo of the client repository.
    required: true
  args:
    description: JSON request numbers from intake, pull_number and comment_id.
    required: true
outputs:
  reservation-id:
    description: Deployment ID for the accepted reservation.
runs:
  using: node24
  main: ../../../dist/server-merge.js

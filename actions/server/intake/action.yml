name: csm-ci intake
description: Validate a csm-ci request label in the server repository and output the normalized request.
inputs:
  github-token:
    description: Token with contents:read and issues:read on the server repository.
    default: ${{ github.token }}
  config-path:
    description: Path of csm-ci.yaml in the server repository.
    default: csm-ci.yaml
outputs:
  kind:
    description: Request kind.
  owner:
    description: Lowercase owner of the client repository.
  name:
    description: Lowercase name of the client repository.
  args:
    description: JSON object of the request numbers.
  concurrency-key:
    description: Key that serializes requests for the same pull request or run.
  automerge-concurrency-key:
    description: Key that serializes automerge evaluations for the same pull request.
  release:
    description: Validated release build configuration, when release is enabled.
  server-bot-id:
    description: Server App bot user ID from csm-ci.yaml.
runs:
  using: node24
  main: ../../../dist/server-intake.js

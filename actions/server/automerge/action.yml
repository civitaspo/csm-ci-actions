name: csm-ci automerge
description: List, evaluate, merge, or record errors for deployment-backed merge reservations.
inputs:
  mode:
    description: list reads active reservations; evaluate checks current readiness; merge revalidates and merges; error-status records an evaluation error.
    required: true
  github-token:
    description: Token with contents:read on the server repository for csm-ci.yaml.
    default: ${{ github.token }}
  deployments-token:
    description: Server App token with deployments read or write access on the server repository.
    required: true
  discovery-token:
    description: Server App token with metadata read access for installation repository discovery.
    required: false
  server-token:
    description: Server App token with contents, pull requests, checks, and statuses read access on the client repository.
    required: false
  notification-token:
    description: Server App token with issues and pull requests write access on the client repository.
    required: false
  write-token:
    description: Server App token with contents, pull requests, and workflows write access, required only in merge mode.
    required: false
  config-path:
    description: Path of csm-ci.yaml in the server repository.
    default: csm-ci.yaml
  repository:
    description: owner/repo of the client repository.
    required: false
  pull-number:
    description: Pull request number to evaluate.
    required: false
  deployment-id:
    description: Deployment ID for a sweep reservation.
    required: false
  head:
    description: Head SHA returned by evaluate mode, required in merge mode.
    required: false
outputs:
  matrix:
    description: JSON array of reservation repository, pull_number, deployment_id, and concurrency_key values.
  count:
    description: Number of reservations returned by list mode.
  ready:
    description: true when the reservation is ready to merge.
  head:
    description: Current pull request head SHA after readiness succeeds.
  deployment-id:
    description: Reservation deployment ID found by evaluate mode.
runs:
  using: node24
  main: ../../../dist/server-automerge.js

name: csm-ci release tag
description: Create the planned annotated tag with the Server App token if it is missing.
inputs:
  github-token:
    description: Server App token with contents:write on the client repository.
    required: true
  plan:
    description: Server-validated release plan JSON.
    required: true
runs:
  using: node24
  main: ../../../dist/server-release-tag.js

name: csm-ci release assets
description: Validate build outputs and create SHA256SUMS without running client code.
inputs:
  directory:
    description: Directory containing build outputs.
    required: false
    default: assets
  plan:
    description: Validated release plan, including the build configuration and version.
    required: true
  source-date-epoch:
    description: Merge commit timestamp, required for Terraform provider signing.
    required: false
  gpg-fingerprint:
    description: Full primary RSA fingerprint for Terraform provider signing.
    required: false
  gpg-private-key:
    description: Dedicated Terraform signing key from the server environment.
    required: false
  gpg-passphrase:
    description: Passphrase for the dedicated Terraform signing key.
    required: false
outputs:
  gpg-public-key:
    description: Public signing key for final Terraform asset revalidation.
  subject-path:
    description: Glob of all validated assets for actions/attest.
  assets:
    description: Sorted asset names and SHA256 digests as JSON.
runs:
  using: node24
  main: ../../../dist/server-release-assets.js

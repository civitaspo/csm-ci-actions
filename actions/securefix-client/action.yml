name: csm-ci securefix client
description: Package and upload uncommitted workflow changes as a bounded securefix artifact.
inputs:
  workspace:
    description: Checked-out client repository directory.
    required: false
  message:
    description: Commit message to use when the server writes the artifact.
    required: false
outputs:
  has-changes:
    description: true when changed files were found and packaged.
    value: ${{ steps.package.outputs.has-changes }}
runs:
  using: composite
  steps:
    - id: package
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../dist/securefix-client.js"
      env:
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_MESSAGE: ${{ inputs.message }}
    - if: steps.package.outputs.has-changes == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: securefix
        path: ${{ steps.package.outputs.artifact-path }}
        if-no-files-found: error
        retention-days: 1

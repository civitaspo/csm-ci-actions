name: csm-ci release PR preparation
description: Generate a release changelog and update version files.
inputs:
  workspace:
    description: Client repository root.
    required: true
  version:
    description: Explicit unprefixed SemVer. When omitted, git-cliff selects the next version.
    required: false
outputs:
  version:
    description: Prepared release version without a v prefix.
    value: ${{ steps.prepare.outputs.version }}
runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
      with:
        tool: git-cliff@2.14.2
        fallback: none
    - id: prepare
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../dist/client-release-prepare.js"
      env:
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_VERSION: ${{ inputs.version }}

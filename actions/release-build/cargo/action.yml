name: csm-ci release build (cargo)
description: Build Cargo binaries for one validated target and package them as a release asset.
inputs:
  client-path:
    description: Path to the isolated source snapshot.
    required: true
  repository:
    description: Client owner/repo name.
    required: true
  version:
    description: Planned semver version.
    required: true
  target:
    description: Allowed Cargo target triple.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CLIENT_PATH: ${{ inputs.client-path }}
        TARGET: ${{ inputs.target }}
        REPOSITORY: ${{ inputs.repository }}
        VERSION: ${{ inputs.version }}
      run: |
        cd "$CLIENT_PATH"
        cargo build --locked --release --bins --target "$TARGET"
        mkdir -p ../assets/staging
        if [[ "$TARGET" == *windows* ]]; then
          while IFS= read -r -d '' file; do cp -- "$file" ../assets/staging/; done < <(find "target/$TARGET/release" -maxdepth 1 -type f -name '*.exe' -print0)
        else
          while IFS= read -r -d '' file; do cp -- "$file" ../assets/staging/; done < <(find "target/$TARGET/release" -maxdepth 1 -type f -perm /111 -print0)
        fi
        if [ -z "$(find ../assets/staging -type f -print -quit)" ]; then
          echo "Cargo produced no executable binaries for $TARGET" >&2
          exit 1
        fi
        name="${REPOSITORY##*/}-${VERSION}-${TARGET}.tar.gz"
        tar -czf "../assets/$name" -C ../assets/staging .
        rm -rf ../assets/staging

name: csm-ci release build (goreleaser)
description: Run GoReleaser without publishing, signing or announcing.
inputs:
  client-path:
    description: Path to the isolated source snapshot.
    required: true
runs:
  using: composite
  steps:
    - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
      with:
        version: v2.19.0
        distribution: goreleaser
        workdir: ${{ inputs.client-path }}
        args: release --skip=publish,sign,announce --clean
    - shell: bash
      env:
        CLIENT_PATH: ${{ inputs.client-path }}
      run: |
        mkdir -p assets
        while IFS= read -r -d '' file; do
          name="${file##*/}"
          if [ -e "assets/$name" ]; then
            echo "duplicate GoReleaser asset name: $name" >&2
            exit 1
          fi
          cp -- "$file" "assets/$name"
        done < <(find "$CLIENT_PATH/dist" -type f -print0)

name: csm-ci release plan
description: Validate a release pull request and produce a server-verified release plan.
inputs:
  github-token:
    description: Server App token with contents:read and pull_requests:read on the client repository.
    required: true
  repository:
    description: Managed owner/repo name.
    required: true
  pull-number:
    description: Merged release pull request number.
    required: true
  server-bot-id:
    description: Server App bot user ID from the validated server config.
    required: true
  release-config:
    description: Validated release build configuration from the server intake.
    required: true
outputs:
  plan:
    description: Server-validated release facts as JSON.
  repository-owner:
    description: Owner of the client repository.
  repository-name:
    description: Name of the client repository.
  merge-sha:
    description: Merge commit SHA.
  tag:
    description: Release tag.
  version:
    description: Release version.
  build-type:
    description: Validated release build type.
  tag-exists:
    description: Whether plan validation found the expected annotated Server App tag.
  matrix:
    description: Fixed target and runner rows for the isolated build job.
runs:
  using: node24
  main: ../../dist/release-plan.js

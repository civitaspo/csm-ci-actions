name: csm-ci request
description: Create a csm-ci request label in the server repository from a client repository.
inputs:
  github-token:
    description: Client App installation token with issues:write on the server repository.
    required: true
  server-repository:
    description: owner/repo of the server repository.
    required: true
  kind:
    description: Request kind, such as approve or command.
    required: true
  args:
    description: Request numbers joined by a slash, such as 12 or 12/3456.
    required: true
outputs:
  label:
    description: Name of the created label.
runs:
  using: node24
  main: ../../dist/request.js

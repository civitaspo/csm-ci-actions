name: csm-ci release attestation verification
run-name: csm-ci-release-verify ${{ inputs.correlation }}

on:
  workflow_dispatch:
    inputs:
      correlation:
        required: true
        type: string
      tag:
        required: true
        type: string
      merge_sha:
        required: true
        type: string
      client_repository:
        required: true
        type: string
      signer_workflow:
        required: true
        type: string
      predicate_type:
        required: true
        type: string
      terraform_signer_run:
        description: Server release run containing the public Terraform verification key.
        required: false
        type: string
      terraform_fingerprint:
        description: Human-provisioned testing RSA key's full primary fingerprint.
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_REPOSITORY: ${{ inputs.client_repository }}
          TAG: ${{ inputs.tag }}
          RELEASE_DIR: ${{ runner.temp }}/release-assets
        run: gh release download "$TAG" --repo "$CLIENT_REPOSITORY" --dir "$RELEASE_DIR"
      - name: Verify the published SHA256SUMS
        env:
          RELEASE_DIR: ${{ runner.temp }}/release-assets
        run: |
          cd "$RELEASE_DIR"
          if [ ! -f SHA256SUMS ]; then
            echo "release has no SHA256SUMS" >&2
            exit 1
          fi
          if grep -q '[^[:space:]]' SHA256SUMS; then
            sha256sum --check SHA256SUMS
          fi
          shopt -s nullglob
          for sidecar in *.sha256; do
            sha256sum --check "$sidecar"
          done
      - if: inputs.terraform_signer_run != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: civitaspo/csm-ci-actions
          ref: e2e
          persist-credentials: false
      - if: inputs.terraform_signer_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: terraform-signing-public-key
          run-id: ${{ inputs.terraform_signer_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/terraform-public-key
      - if: inputs.terraform_signer_run != ''
        name: Verify Registry archives, manifest, checksums and RSA signature
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_REPOSITORY: ${{ inputs.client_repository }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          TAG: ${{ inputs.tag }}
          FINGERPRINT: ${{ inputs.terraform_fingerprint }}
          RELEASE_DIR: ${{ runner.temp }}/release-assets
        run: |
          committed=$(gh api "repos/$CLIENT_REPOSITORY/commits/$MERGE_SHA" --jq '.commit.committer.date')
          epoch=$(date -d "$committed" +%s)
          jq -n --rawfile key "$RUNNER_TEMP/terraform-public-key/terraform-signing-public-key.asc" '{key:$key}' | \
            python3 -B actions/server/release-assets/terraform.py verify \
              "$RELEASE_DIR" csm-ci-test "${TAG#v}" "$epoch" "$FINGERPRINT" >/dev/null
      - name: Verify each signature and release predicate
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_REPOSITORY: ${{ inputs.client_repository }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          TAG: ${{ inputs.tag }}
          SIGNER_WORKFLOW: ${{ inputs.signer_workflow }}
          PREDICATE_TYPE: ${{ inputs.predicate_type }}
          RELEASE_DIR: ${{ runner.temp }}/release-assets
        run: |
          shopt -s nullglob
          assets=("$RELEASE_DIR"/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "release has no assets" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            gh attestation verify "$asset" \
              --owner "${SIGNER_WORKFLOW%%/*}" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --predicate-type "$PREDICATE_TYPE" \
              --deny-self-hosted-runners \
              --format json > "$RUNNER_TEMP/attestation.json"
            jq -e --arg repository "$CLIENT_REPOSITORY" --arg sha "$MERGE_SHA" --arg tag "$TAG" \
              'any(.[].verificationResult.statement; .predicate.client_repository == $repository and .predicate.merge_sha == $sha and .predicate.tag == $tag)' \
              "$RUNNER_TEMP/attestation.json" >/dev/null
            echo "verified $(basename "$asset")"
          done

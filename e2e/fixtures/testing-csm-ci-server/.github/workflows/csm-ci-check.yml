name: csm-ci-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # e2e branch is moved to the commit under test by csm-ci-actions/e2e/run.ts.
    # jactionlint ignore=unpinned-uses
    uses: civitaspo/csm-ci-actions/.github/workflows/server-check.yml@e2e
    permissions:
      contents: read

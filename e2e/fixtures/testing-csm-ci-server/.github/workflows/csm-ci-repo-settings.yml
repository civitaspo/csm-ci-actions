name: csm-ci repo-settings e2e
run-name: csm-ci-repo-settings ${{ inputs.correlation }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Configured testing repository to reconcile.
        required: true
        type: string
      event-mode:
        description: Exercise the schedule or dispatch reconciliation branch.
        required: true
        type: choice
        options:
          - schedule
          - dispatch
      targets:
        description: Comma-separated settings, rulesets, releases, managed-files, or all.
        required: false
        type: string
        default: all
      correlation:
        description: Unique e2e run identifier.
        required: false
        type: string
      config-path:
        description: Optional csm-ci.yaml path for controlled fixture scenarios.
        required: false
        type: string
      workflow-release:
        description: Released revision JSON for the schedule branch, which skips discovery.
        required: false
        type: string

permissions: {}

jobs:
  dispatch:
    if: inputs.event-mode == 'dispatch'
    # jactionlint ignore=unpinned-uses
    uses: civitaspo/csm-ci-actions/.github/workflows/server-repo-settings.yml@e2e
    with:
      repository: ${{ inputs.repository }}
      targets: ${{ inputs.targets }}
      config-path: ${{ inputs.config-path || 'csm-ci.yaml' }}
    secrets:
      CSM_CI_SERVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
      CSM_CI_APPROVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_APPROVER_APP_PRIVATE_KEY }}
    permissions:
      contents: read
  schedule:
    if: inputs.event-mode == 'schedule'
    # jactionlint ignore=unpinned-uses
    uses: civitaspo/csm-ci-actions/.github/workflows/server-repo-settings-target.yml@e2e
    with:
      workflow-release: ${{ inputs.workflow-release }}
      repository: ${{ inputs.repository }}
      event-mode: ${{ inputs.event-mode }}
      targets: ${{ inputs.targets }}
      config-path: ${{ inputs.config-path || 'csm-ci.yaml' }}
    secrets:
      CSM_CI_SERVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
      CSM_CI_APPROVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_APPROVER_APP_PRIVATE_KEY }}
    permissions:
      contents: read

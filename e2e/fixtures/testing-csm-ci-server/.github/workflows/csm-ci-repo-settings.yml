name: csm-ci repo-settings e2e
run-name: csm-ci-repo-settings ${{ inputs.correlation }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Configured testing repository to reconcile.
        required: true
        type: string
      event-mode:
        description: Exercise the schedule or dispatch reconciliation branch.
        required: true
        type: choice
        options:
          - schedule
          - dispatch
      mode:
        description: Reconcile settings, or distribute managed files only.
        required: false
        type: choice
        options:
          - reconcile
          - managed-files-only
      correlation:
        description: Unique e2e run identifier.
        required: false
        type: string
      config-path:
        description: Optional csm-ci.yaml path for controlled fixture scenarios.
        required: false
        type: string

permissions: {}

jobs:
  dispatch:
    if: inputs.event-mode == 'dispatch'
    # jactionlint ignore=unpinned-uses,secrets-inherit
    uses: civitaspo/csm-ci-actions/.github/workflows/server-repo-settings.yml@e2e
    with:
      repository: ${{ inputs.repository }}
      mode: ${{ inputs.mode || 'reconcile' }}
      config-path: ${{ inputs.config-path || 'csm-ci.yaml' }}
    secrets: inherit
    permissions:
      contents: read
  schedule:
    if: inputs.event-mode == 'schedule'
    # jactionlint ignore=unpinned-uses,secrets-inherit
    uses: civitaspo/csm-ci-actions/.github/workflows/server-repo-settings-target.yml@e2e
    with:
      repository: ${{ inputs.repository }}
      event-mode: ${{ inputs.event-mode }}
      mode: ${{ inputs.mode || 'reconcile' }}
      config-path: ${{ inputs.config-path || 'csm-ci.yaml' }}
    secrets: inherit
    permissions:
      contents: read

name: csm-ci-probe
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: csm-ci
    steps:
      - id: server
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          # The token must cover every installed repository so the last step can compare the set.
          # jactionlint ignore=github-app
          owner: ${{ github.repository_owner }}
          permission-actions: read
          permission-administration: write
          permission-attestations: write
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
      - id: approver
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_APPROVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_APPROVER_APP_PRIVATE_KEY }}
          # The token must cover every installed repository so the last step can compare the set.
          # jactionlint ignore=github-app
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-pull-requests: write
      - name: Installed repositories match the plan
        env:
          SERVER_TOKEN: ${{ steps.server.outputs.token }}
          APPROVER_TOKEN: ${{ steps.approver.outputs.token }}
        run: |
          installed() { GH_TOKEN="$1" gh api /installation/repositories --jq '[.repositories[].name] | sort | join(",")'; }
          test "$(installed "$SERVER_TOKEN")" = "testing-csm-ci-client,testing-csm-ci-server"
          test "$(installed "$APPROVER_TOKEN")" = "testing-csm-ci-client"

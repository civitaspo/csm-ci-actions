name: csm-ci-release-pr
run-name: "csm-ci-release-pr ${{ inputs.correlation || github.sha }}"
# Each e2e request must complete so the harness can correlate it.
# jactionlint ignore=concurrency-limits
on:
  push:
    branches: [main]
    paths: [e2e/release-pr-trigger.txt]
  workflow_dispatch:
    inputs:
      correlation:
        description: E2E request correlation.
        type: string
        required: false
      version:
        description: Optional semantic version without a v prefix.
        type: string
        required: false
      version-files:
        description: Optional JSON array of root version files to update.
        type: string
        required: false
        default: ""
permissions: {}
jobs:
  release-pr:
    permissions:
      contents: read
    # The harness moves this branch to the commit under test.
    # jactionlint ignore=unpinned-uses
    uses: civitaspo/csm-ci-actions/.github/workflows/client-release-prepare.yml@e2e
    with:
      version: ${{ inputs.version || '' }}
      version-files: ${{ inputs.version-files || '' }}
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}

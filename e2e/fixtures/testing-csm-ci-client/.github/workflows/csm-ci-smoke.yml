name: csm-ci-smoke
run-name: csm-ci-smoke ${{ inputs.correlation }}
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Request kind.
        required: true
        type: string
      args:
        description: Request numbers joined by a slash.
        required: true
        type: string
      correlation:
        description: Unique identifier assigned by the e2e harness.
        required: true
        type: string
permissions: {}
jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_CLIENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
          repositories: ${{ vars.CSM_CI_SERVER_REPOSITORY }}
          permission-issues: write
      - name: Create test request label
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SERVER: ${{ vars.CSM_CI_SERVER_REPOSITORY }}
          KIND: ${{ inputs.kind }}
          ARGS: ${{ inputs.args }}
        run: |
          label="csm-ci-${KIND}-$(openssl rand -hex 8)"
          description="${GITHUB_REPOSITORY,,}/$ARGS"
          gh api --method POST "repos/$SERVER/labels" -f name="$label" -f description="$description" -f color=ededed >/dev/null
          echo "created label $label ($description) in $SERVER"

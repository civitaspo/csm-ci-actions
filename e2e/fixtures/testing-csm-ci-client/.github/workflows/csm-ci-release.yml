name: csm-ci-release
run-name: "csm-ci release #${{ github.event.pull_request.number }}"

# Each e2e request must complete so the harness can correlate it.
# jactionlint ignore=concurrency-limits
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  release:
    # The reusable workflow needs the Client App key from the client repository.
    # The harness moves this branch to the commit under test.
    # jactionlint ignore=unpinned-uses
    uses: civitaspo/csm-ci-actions/.github/workflows/client-release-publish.yml@e2e
    secrets:
      CSM_CI_CLIENT_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}

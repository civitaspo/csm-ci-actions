name: csm-ci-probe
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: client
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_CLIENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
          # The token must cover every installed repository so the last step can compare the set.
          # jactionlint ignore=github-app
          owner: ${{ github.repository_owner }}
          permission-issues: write
      - name: Installed repositories match the plan
        env:
          CLIENT_TOKEN: ${{ steps.client.outputs.token }}
        run: |
          test "$(GH_TOKEN="$CLIENT_TOKEN" gh api /installation/repositories --jq '[.repositories[].name] | sort | join(",")')" = "testing-csm-ci-server"

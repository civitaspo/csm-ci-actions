name: csm-ci-securefix-forged
# Each e2e request must complete so the harness can correlate it.
# jactionlint ignore=concurrency-limits
on:
  pull_request:
    paths:
      - e2e/securefix-forged-trigger.txt
permissions: {}
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Create a forged securefix artifact
        run: |
          mkdir -p securefix/files
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { mkdirSync, writeFileSync } from "node:fs";
          mkdirSync("securefix/files", { recursive: true });
          const content = Buffer.from("forged\n");
          writeFileSync("securefix/files/0000", content);
          writeFileSync("securefix/manifest.json", JSON.stringify({
            version: 1,
            repository: process.env.GITHUB_REPOSITORY,
            run_id: Number(process.env.GITHUB_RUN_ID) + 1,
            head_sha: process.env.GITHUB_SHA,
            message: "e2e forged metadata",
            files: [{ kind: "write", path: "e2e/forged.txt", size: content.length, sha256: createHash("sha256").update(content).digest("hex") }],
          }));
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: securefix
          path: securefix/
          if-no-files-found: error
          retention-days: 1
      # The real client action refuses to build this artifact, so the request is sent directly.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_CLIENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
          repositories: ${{ vars.CSM_CI_SERVER_REPOSITORY }}
          permission-issues: write
      - name: Create test request label
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SERVER: ${{ vars.CSM_CI_SERVER_REPOSITORY }}
          KIND: securefix
          ARGS: ${{ github.run_id }}
        run: |
          label="csm-ci-${KIND}-$(openssl rand -hex 8)"
          description="${GITHUB_REPOSITORY,,}/$ARGS"
          gh api --method POST "repos/$SERVER/labels" -f name="$label" -f description="$description" -f color=ededed >/dev/null
          echo "created label $label ($description) in $SERVER"

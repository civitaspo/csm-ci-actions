name: csm-ci-securefix-route
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Route change fixture mode.
        required: true
        type: choice
        options:
          - valid
          - out-of-scope
          - version-only
permissions: {}
jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Make the route change
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            out-of-scope)
              printf 'out of scope\n' >> README.md
              ;;
            version-only)
              node -e 'const fs = require("node:fs"); const path = "e2e/securefix-version.json"; const value = JSON.parse(fs.readFileSync(path, "utf8")); value.description = `${value.description ?? ""} e2e change`; fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`)'
              ;;
            *)
              printf 'route update\n' > e2e/securefix-route-result.txt
              ;;
          esac
      - uses: civitaspo/csm-ci-actions/actions/securefix-client@e2e
        with:
          client-id: ${{ vars.CSM_CI_CLIENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
          server-repository: ${{ vars.CSM_CI_SERVER_REPOSITORY }}
          message: e2e route ${{ inputs.mode }}
